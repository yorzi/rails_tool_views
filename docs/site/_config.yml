title: "RailsToolViews"
description: "Register trusted Rails components, persist UI state, and authorize user actions with optional AI adapters."
tagline: "Turn Rails views into interactive tools"
url: https://rails-tool-views.wangyaodi.com
baseurl: ""
lang: en-US
repository: yorzi/rails_tool_views

theme: jekyll-vitepress-theme

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false
permalink: pretty

collections:
  getting_started:
    permalink: "/:name/"
    output: true
  core_features:
    permalink: "/:name/"
    output: true
  advanced:
    permalink: "/:name/"
    output: true
  reference:
    permalink: "/:name/"
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
      jekyll_vitepress:
        auto_title: false

jekyll_vitepress:
  seo:
    page_type: TechArticle
    publisher:
      type: Organization
      name: "RailsToolViews"
      url: https://rails-tool-views.wangyaodi.com
      same_as:
        - https://github.com/yorzi/rails_tool_views
  llms:
    title: RailsToolViews Documentation
    description: "Register trusted Rails components, persist UI state, and authorize user actions with optional AI adapters."
    full: true
  branding:
    site_title: "RailsToolViews"
  typography:
    body_font_family: "'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    code_font_family: "'IBM Plex Mono', ui-monospace, monospace"
    google_fonts_url: ""
  syntax:
    light_theme: github
    dark_theme: github.dark
  tokens:
    light:
      "--vp-c-brand-1": "#BA3D32"
      "--vp-c-brand-2": "#CB4B3F"
      "--vp-c-brand-3": "#A2352C"
      "--vp-c-brand-soft": "rgba(186, 61, 50, 0.14)"
    dark:
      "--vp-c-brand-1": "#F08F85"
      "--vp-c-brand-2": "#CB4B3F"
      "--vp-c-brand-3": "#BA3D32"
      "--vp-c-brand-soft": "rgba(210, 97, 87, 0.18)"
  github_star:
    enabled: true
    repository: yorzi/rails_tool_views
    text: Star
    show_count: true
  footer:
    enabled: true
    show_on_docs: false
    message: "Unofficial Rails community project. Rails marks belong to David Heinemeier Hansson and are exclusively licensed to the Rails Foundation. Framework names identify compatibility, without endorsement or affiliation. Released under the MIT license."
    copyright: "Copyright © 2026 Andy Wang"
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%-d %b %Y"
  edit_link:
    enabled: true
    pattern: https://github.com/yorzi/rails_tool_views/edit/main/docs/site/:path
    text: Edit this page on GitHub

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - bin
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - agent
  - human
  - specs
  - evidence
  - operations
  - adr

# The language of code examples; `project-docs` uses it for new pages.
code_language: ruby

# Values that change between releases. Pages read them as {{ site.version }}
# and {{ site.examples.NAME }}, so one edit here updates every page. Set
# `released: true` and the new version in the commit you tag for a release.
released: true
version: "1.0.0"
examples: {}
requirements:
  ruby: "3.3 or later"
  rails: "7.2 up to, but not including, 9"
  ruby_llm: "2.0 or later"
  ruby_llm_tested: "2.0.0 and 2.1.0"

# Preserve generated RDoc while Jekyll regenerates the guides during preview.
keep_files: [api]
