name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'lib/**'
      - 'app/models/**'
      - 'app/helpers/**'
      - 'scripts/check_docs_site.py'
      - '.rdoc_options'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'app/models/**'
      - 'app/helpers/**'
      - 'scripts/check_docs_site.py'
      - '.rdoc_options'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0 # Release tags, for the versioned build.

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs/site

      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH == 'true' && !github.event.repository.private
        uses: actions/configure-pages@v5

      - name: Build
        run: docs/site/bin/build.sh
        env:
          JEKYLL_ENV: production
          BASE: ${{ steps.pages.outputs.base_path || '/rails_tool_views' }}

      - name: Check generated links and content boundary
        run: python3 scripts/check_docs_site.py

      - name: Upload artifact
        if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH == 'true' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site/_site

  deploy:
    if: github.event_name != 'pull_request' && vars.DOCS_PUBLISH == 'true' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
